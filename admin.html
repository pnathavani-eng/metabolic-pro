<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metabolic Pro - Master Admin CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .brand-gradient { background: linear-gradient(135deg, #0d9488, #0284c7); }
    .card-clean { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); }
    .tab-active { background: #0f766e; color: #ffffff !important; font-weight: 700; }
  </style>
</head>
<body class="pb-24 antialiased">

  <div id="adminAuthView" class="min-h-screen flex flex-col justify-center p-4 max-w-sm mx-auto space-y-4">
    <div class="card-clean rounded-3xl p-6 shadow-xl border text-center space-y-4">
      <div class="w-14 h-14 rounded-2xl bg-slate-900 text-teal-400 flex items-center justify-center text-2xl font-black mx-auto">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <h2 class="text-xl font-black text-slate-900">Coach Master Admin</h2>
        <p class="text-xs text-slate-500 mt-0.5">Metabolic Pro Cloud CRM</p>
      </div>
      <div class="space-y-3 text-left">
        <input type="password" maxlength="8" id="inAdminPin" placeholder="Admin PIN (1234)" class="w-full p-3 bg-slate-50 border rounded-xl text-center text-xl font-black">
        <button onclick="verifyAdminPin()" class="w-full py-3.5 rounded-2xl bg-slate-900 text-white font-extrabold text-xs shadow">Access Master CRM 🔐</button>
      </div>
    </div>
  </div>

  <div id="adminMainView" class="hidden min-h-screen">
    <header class="p-3.5 bg-slate-900 text-white sticky top-0 z-40 flex justify-between items-center shadow-md">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-teal-500 text-slate-900 font-black flex items-center justify-center text-sm">MP</div>
        <h1 class="font-extrabold text-white text-sm">Admin CRM & Master Grocery</h1>
      </div>
      <button onclick="logoutAdmin()" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg text-xs">Logout</button>
    </header>

    <div class="flex p-2 gap-1.5 bg-white border-b text-xs overflow-x-auto">
      <button onclick="setAdminTab('clients')" id="atab-clients" class="tab-active px-3 py-2 rounded-xl whitespace-nowrap"><i class="fa-solid fa-users"></i> Clients</button>
      <button onclick="setAdminTab('grocery')" id="atab-grocery" class="px-3 py-2 rounded-xl bg-slate-100 text-slate-600 whitespace-nowrap"><i class="fa-solid fa-carrot"></i> Master Grocery & GI</button>
    </div>

    <main class="p-3.5 max-w-lg mx-auto space-y-3.5">
      <!-- Clients Tab -->
      <section id="aview-clients" class="space-y-3">
        <button onclick="openModal()" class="w-full bg-teal-600 text-white font-bold py-3 rounded-xl text-xs shadow-sm">+ Add New Client to Cloud</button>
        <div id="admClientsList" class="space-y-3"></div>
      </section>

      <!-- Master Grocery Tab -->
      <section id="aview-grocery" class="hidden space-y-3 text-xs">
        <div class="card-clean p-4 rounded-2xl space-y-3">
          <h2 class="font-bold text-slate-800 text-sm">Master Grocery, Calories & GI Database</h2>
          <p class="text-[11px] text-slate-500">Complete list of vegetables, fruits, dairy, grains and farsan available in the system.</p>
          <div id="groceryItemsList" class="space-y-2"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="admModal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm p-4 rounded-3xl space-y-2.5 text-xs shadow-xl">
      <div class="flex justify-between items-center"><h3 class="font-bold">Add Client</h3><button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
      <input type="text" id="mName" placeholder="Full Name" class="w-full p-2 border rounded-lg">
      <input type="text" id="mPhone" placeholder="WhatsApp Number" class="w-full p-2 border rounded-lg">
      <select id="mGoal" class="w-full p-2 border rounded-lg">
        <option value="Fatty Liver Detox">🥒 Fatty Liver Detox</option>
        <option value="Type 2 Diabetes Reversal">🩺 Type 2 Diabetes Reversal</option>
      </select>
      <select id="mDiet" class="w-full p-2 border rounded-lg"><option value="veg">Vegetarian</option><option value="nonveg">Non-Vegetarian</option></select>
      <input type="number" id="mDays" value="30" placeholder="Trial Days (999 for Lifetime VIP)" class="w-full p-2 border rounded-lg">
      <button onclick="addNewClientToCloud()" class="w-full bg-teal-600 text-white font-bold py-2 rounded-xl">Save to Cloud</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC7HLpZIEayOfmUuHVK_8Fm34Un73i33KE",
      authDomain: "metabolic-pro-bd3a2.firebaseapp.com",
      projectId: "metabolic-pro-bd3a2",
      storageBucket: "metabolic-pro-bd3a2.firebasestorage.app",
      messagingSenderId: "462945165017",
      appId: "1:462945165017:web:4e4727c725eb643a29a8c8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // FULL MASTER DATABASE IN ADMIN
    const MASTER_GROCERY_DB = {
      "Ash Gourd": { cal: 13, gi: 15 },
      "Bottle Gourd": { cal: 21, gi: 15 },
      "Coriander": { cal: 23, gi: 15 },
      "Raw Turmeric": { cal: 35, gi: 20 },
      "Fresh Ginger": { cal: 80, gi: 15 },
      "Moong Dal Chila": { cal: 220, gi: 38 },
      "Fresh Paneer": { cal: 265, gi: 15 },
      "Salad Barrier": { cal: 25, gi: 15 },
      "Multi-Millet Roti": { cal: 110, gi: 35 },
      "Chaas": { cal: 40, gi: 15 },
      "Roasted Makhana": { cal: 347, gi: 45 },
      "Pumpkin Puree": { cal: 40, gi: 30 },
      "Steamed Moong": { cal: 105, gi: 25 },
      "Sprouted Chana": { cal: 120, gi: 28 },
      "Ragi Cheela": { cal: 240, gi: 50 },
      "Palak Paneer": { cal: 180, gi: 20 },
      "Sev Usal": { cal: 310, gi: 55 },
      "Poha": { cal: 180, gi: 65 },
      "Ganthiya": { cal: 480, gi: 75 },
      "Bhajiya": { cal: 420, gi: 70 },
      "Puri": { cal: 500, gi: 80 },
      "Fafda": { cal: 430, gi: 72 },
      "Sev": { cal: 520, gi: 78 },
      "Kachori": { cal: 450, gi: 75 },
      "Samosa": { cal: 310, gi: 72 },
      "Kiwi": { cal: 61, gi: 52 },
      "Dragon Fruit": { cal: 60, gi: 48 },
      "Pomegranate": { cal: 83, gi: 53 },
      "Apple": { cal: 52, gi: 36 },
      "Guava": { cal: 68, gi: 24 },
      "Papaya": { cal: 43, gi: 60 },
      "Sweet Lime": { cal: 47, gi: 43 },
      "Watermelon": { cal: 30, gi: 72 },
      "Mango": { cal: 60, gi: 51 },
      "Banana": { cal: 89, gi: 51 }
    };

    let liveClients = [];

    function verifyAdminPin() {
      if(document.getElementById('inAdminPin').value.trim() === '1234') {
        document.getElementById('adminAuthView').classList.add('hidden');
        document.getElementById('adminMainView').classList.remove('hidden');
        listenToClients();
        renderMasterGrocery();
      } else alert('Invalid PIN');
    }

    function logoutAdmin() { location.reload(); }

    function setAdminTab(tab) {
      ['clients', 'grocery'].forEach(t => {
        document.getElementById('aview-' + t).classList.add('hidden');
        document.getElementById('atab-' + t).className = "px-3 py-2 rounded-xl bg-slate-100 text-slate-600 whitespace-nowrap";
      });
      document.getElementById('aview-' + tab).classList.remove('hidden');
      document.getElementById('atab-' + tab).className = "tab-active px-3 py-2 rounded-xl whitespace-nowrap";
    }

    function listenToClients() {
      db.collection('clients').orderBy('createdAt', 'desc').onSnapshot(snap => {
        liveClients = [];
        snap.forEach(d => liveClients.push({ id: d.id, ...d.data() }));
        renderClients();
      });
    }

    function renderClients() {
      const c = document.getElementById('admClientsList');
      c.innerHTML = '';
      if(liveClients.length === 0) { c.innerHTML = '<div class="text-center py-6 text-slate-400">No clients yet.</div>'; return; }
      liveClients.forEach(cl => {
        c.innerHTML += `
          <div class="card-clean p-3.5 rounded-2xl space-y-2 border">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold">${cl.name} (${cl.phone})</span>
              <span class="text-[10px] font-extrabold px-2 py-0.5 bg-teal-50 text-teal-800 rounded">${cl.trialDays>=900 ? 'Lifetime VIP' : cl.trialDays+' Days Trial'}</span>
            </div>
            <div class="flex gap-1.5 pt-1">
              <button onclick="updateTrial('${cl.id}', 30)" class="px-2 py-1 bg-slate-100 text-[10px] rounded">30 Days</button>
              <button onclick="updateTrial('${cl.id}', 999)" class="px-2 py-1 bg-slate-900 text-white text-[10px] rounded font-bold">Make Lifetime VIP</button>
              <button onclick="db.collection('clients').doc('${cl.id}').delete()" class="text-rose-600 text-[10px] ml-auto">Delete</button>
            </div>
          </div>
        `;
      });
    }

    async function updateTrial(id, days) {
      await db.collection('clients').doc(id).update({ trialDays: days });
      alert('Updated access successfully!');
    }

    function renderMasterGrocery() {
      const c = document.getElementById('groceryItemsList');
      c.innerHTML = '';
      for(let item in MASTER_GROCERY_DB) {
        const isHighGi = MASTER_GROCERY_DB[item].gi >= 70;
        c.innerHTML += `
          <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border text-xs">
            <span class="font-bold text-slate-800">${item}</span>
            <div class="flex items-center gap-2">
              ${isHighGi ? '<span class="px-1.5 py-0.5 bg-rose-100 text-rose-800 text-[9px] font-black rounded">Red Zone</span>' : ''}
              <span class="text-teal-800 font-semibold">🔥 ${MASTER_GROCERY_DB[item].cal} kcal</span>
              <span class="text-sky-800 font-semibold">GI: ${MASTER_GROCERY_DB[item].gi}</span>
            </div>
          </div>`;
      }
    }

    function openModal() { document.getElementById('admModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('admModal').classList.add('hidden'); }

    async function addNewClientToCloud() {
      const n = document.getElementById('mName').value.trim();
      const p = document.getElementById('mPhone').value.trim().replace(/\D/g,'');
      const g = document.getElementById('mGoal').value;
      const d = document.getElementById('mDiet').value;
      const days = parseInt(document.getElementById('mDays').value) || 30;
      if(!n || p.length < 10) return alert('Enter valid name and number');

      await db.collection('clients').doc(p).set({
        name: n, phone: p, pin: p.slice(-4), goal: g, diet: d, trialDays: days,
        joiningDate: new Date().toISOString().split('T')[0],
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        compliance: {}, weeklyPlan: {}
      });
      closeModal();
      alert('Client added successfully!');
    }
  </script>
</body>
</html>
