<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metabolic Pro - Master Admin CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .brand-gradient { background: linear-gradient(135deg, #0d9488, #0284c7); }
    .card-clean { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); }
    .tab-active { background: #0f766e; color: #ffffff !important; font-weight: 700; }
  </style>
</head>
<body class="pb-24 antialiased">

  <div id="adminAuthView" class="min-h-screen flex flex-col justify-center p-4 max-w-sm mx-auto space-y-4">
    <div class="card-clean rounded-3xl p-6 shadow-xl border text-center space-y-4">
      <div class="w-14 h-14 rounded-2xl bg-slate-900 text-teal-400 flex items-center justify-center text-2xl font-black mx-auto">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <h2 class="text-xl font-black text-slate-900">Coach Master Admin</h2>
        <p class="text-xs text-slate-500 mt-0.5">Metabolic Pro Cloud CRM</p>
      </div>
      <div class="space-y-3 text-left">
        <input type="password" maxlength="8" id="inAdminPin" placeholder="Enter Admin PIN" class="w-full p-3 bg-slate-50 border rounded-xl text-center text-xl font-black">
        <button onclick="verifyAdminPin()" class="w-full py-3.5 rounded-2xl bg-slate-900 text-white font-extrabold text-xs shadow">Access Master CRM 🔐</button>
      </div>
    </div>
  </div>

  <div id="adminMainView" class="hidden min-h-screen">
    <header class="p-3.5 bg-slate-900 text-white sticky top-0 z-40 flex justify-between items-center shadow-md">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-teal-500 text-slate-900 font-black flex items-center justify-center text-sm">MP</div>
        <h1 class="font-extrabold text-white text-sm">Admin CRM & Master Nutrition Engine</h1>
      </div>
      <button onclick="logoutAdmin()" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg text-xs">Logout</button>
    </header>

    <div class="flex p-2 gap-1.5 bg-white border-b text-xs overflow-x-auto">
      <button onclick="setAdminTab('clients')" id="atab-clients" class="tab-active px-3 py-2 rounded-xl whitespace-nowrap"><i class="fa-solid fa-users"></i> Clients</button>
      <button onclick="setAdminTab('grocery')" id="atab-grocery" class="px-3 py-2 rounded-xl bg-slate-100 text-slate-600 whitespace-nowrap"><i class="fa-solid fa-carrot"></i> Master Nutrition & Macro DB</button>
    </div>

    <main class="p-3.5 max-w-lg mx-auto space-y-3.5">
      <!-- Clients Tab -->
      <section id="aview-clients" class="space-y-3">
        <button onclick="openModal()" class="w-full bg-teal-600 text-white font-bold py-3 rounded-xl text-xs shadow-sm">+ Add New Client with Protocol</button>
        <div id="admClientsList" class="space-y-3"></div>
      </section>

      <!-- Master Grocery Tab -->
      <section id="aview-grocery" class="hidden space-y-3 text-xs">
        <div class="card-clean p-4 rounded-2xl space-y-3">
          <h2 class="font-bold text-slate-800 text-sm">Master Food, Calories, Protein & GI Database</h2>
          <p class="text-[11px] text-slate-500">Clinical macro database synced with Client Portal.</p>
          <div id="groceryItemsList" class="space-y-2"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Client Add Modal -->
  <div id="admModal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm p-4 rounded-3xl space-y-2.5 text-xs shadow-xl">
      <div class="flex justify-between items-center"><h3 class="font-bold">Add Client to Protocol</h3><button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
      <input type="text" id="mName" placeholder="Full Name" class="w-full p-2 border rounded-lg">
      <input type="text" id="mPhone" placeholder="WhatsApp Number (10 Digits)" class="w-full p-2 border rounded-lg">
      
      <div class="grid grid-cols-3 gap-1.5">
        <input type="number" id="mAge" placeholder="Age (e.g. 38)" value="38" class="p-2 border rounded-lg">
        <input type="number" id="mHeight" placeholder="Height cm" value="170" class="p-2 border rounded-lg">
        <input type="number" id="mWeight" placeholder="Weight kg" value="75" class="p-2 border rounded-lg">
      </div>

      <div class="grid grid-cols-2 gap-1.5">
        <select id="mGender" class="p-2 border rounded-lg font-semibold">
          <option value="male">Male (પુરુષ)</option>
          <option value="female">Female (મહિલા)</option>
        </select>
        <select id="mActivity" class="p-2 border rounded-lg font-semibold">
          <option value="sedentary">Sedentary</option>
          <option value="light" selected>Light Walk/Yoga</option>
          <option value="moderate">Gym (3-5 days)</option>
          <option value="active">Heavy Workout</option>
        </select>
      </div>

      <select id="mGoalKey" class="w-full p-2 border rounded-lg font-semibold">
        <option value="diabetes_reversal" selected>🩺 Type 2 Diabetes Remission</option>
        <option value="fat_loss">⚖️ Fat Loss & Calorie Deficit</option>
        <option value="muscle_gym">💪 Gym & Lean Muscle Gain</option>
        <option value="fatty_liver_bp">🥒 Fatty Liver & BP Detox</option>
      </select>

      <div class="grid grid-cols-2 gap-1.5">
        <select id="mDiet" class="p-2 border rounded-lg"><option value="veg">Vegetarian</option><option value="nonveg">Non-Vegetarian</option></select>
        <input type="number" id="mDays" value="30" placeholder="Trial Days (999 for VIP)" class="p-2 border rounded-lg">
      </div>

      <button onclick="addNewClientToCloud()" class="w-full bg-teal-600 text-white font-bold py-2.5 rounded-xl mt-1">Save Client to Cloud 🚀</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC7HLpZIEayOfmUuHVK_8Fm34Un73i33KE",
      authDomain: "metabolic-pro-bd3a2.firebaseapp.com",
      projectId: "metabolic-pro-bd3a2",
      storageBucket: "metabolic-pro-bd3a2.firebasestorage.app",
      messagingSenderId: "462945165017",
      appId: "1:462945165017:web:4e4727c725eb643a29a8c8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // FULL SYNCED MASTER DATABASE (CALORIES, PROTEIN, GI)
    const MASTER_GROCERY_DB = {
      "Sweet Lime": { cal: 47, p: 0.8, gi: 43 },
      "Ash Gourd": { cal: 13, p: 0.4, gi: 15 },
      "Bottle Gourd": { cal: 21, p: 1.1, gi: 15 },
      "Coriander": { cal: 23, p: 2.1, gi: 15 },
      "Raw Turmeric": { cal: 35, p: 1.0, gi: 20 },
      "Fresh Ginger": { cal: 80, p: 1.8, gi: 15 },
      "Moong Dal Chila": { cal: 220, p: 12.0, gi: 38 },
      "Fresh Paneer": { cal: 265, p: 18.0, gi: 15 },
      "Grilled Paneer": { cal: 265, p: 18.0, gi: 15 },
      "Paneer Tikka": { cal: 220, p: 16.0, gi: 20 },
      "Tofu": { cal: 140, p: 15.0, gi: 15 },
      "Soya Chunks Curry": { cal: 240, p: 26.0, gi: 25 },
      "Whey Protein": { cal: 120, p: 24.0, gi: 10 },
      "Salad Barrier": { cal: 25, p: 1.2, gi: 15 },
      "Multi-Millet Roti": { cal: 110, p: 3.5, gi: 35 },
      "Jowar Roti": { cal: 110, p: 3.2, gi: 40 },
      "Bajra Roti": { cal: 115, p: 3.8, gi: 45 },
      "Chaas": { cal: 40, p: 3.0, gi: 15 },
      "Curd": { cal: 60, p: 4.0, gi: 28 },
      "Roasted Makhana": { cal: 120, p: 4.0, gi: 45 },
      "Pumpkin Puree": { cal: 40, p: 1.0, gi: 30 },
      "Steamed Moong": { cal: 105, p: 7.0, gi: 25 },
      "Sprouted Chana": { cal: 120, p: 8.0, gi: 28 },
      "Boiled Chana": { cal: 130, p: 8.5, gi: 28 },
      "Roasted Chana": { cal: 160, p: 10.0, gi: 28 },
      "Ragi Cheela": { cal: 200, p: 6.0, gi: 50 },
      "Besan Chila": { cal: 190, p: 9.0, gi: 40 },
      "Palak Paneer": { cal: 180, p: 12.0, gi: 20 },
      "Sev Usal": { cal: 310, p: 8.0, gi: 55 },
      "Poha": { cal: 180, p: 3.0, gi: 65 },
      "Ganthiya": { cal: 480, p: 10.0, gi: 75 },
      "Bhajiya": { cal: 420, p: 6.0, gi: 70 },
      "Puri": { cal: 500, p: 7.0, gi: 80 },
      "Fafda": { cal: 430, p: 8.0, gi: 72 },
      "Sev": { cal: 520, p: 9.0, gi: 78 },
      "Kachori": { cal: 450, p: 7.0, gi: 75 },
      "Samosa": { cal: 310, p: 5.0, gi: 72 },
      "Sweet": { cal: 400, p: 4.0, gi: 75 },
      "Mithai": { cal: 400, p: 4.0, gi: 75 },
      "Gulab Jamun": { cal: 380, p: 4.0, gi: 75 },
      "Jalebi": { cal: 450, p: 3.0, gi: 80 },
      "Kaju Katli": { cal: 420, p: 6.0, gi: 70 },
      "Ladoo": { cal: 410, p: 5.0, gi: 75 },
      "Peda": { cal: 390, p: 6.0, gi: 70 }
    };

    let liveClients = [];

    function verifyAdminPin() {
      const pin = document.getElementById('inAdminPin').value.trim();
      if(pin === '1234') {
        document.getElementById('adminAuthView').classList.add('hidden');
        document.getElementById('adminMainView').classList.remove('hidden');
        listenToClients();
        renderMasterGrocery();
      } else {
        alert('Invalid PIN');
      }
    }

    function logoutAdmin() { location.reload(); }

    function setAdminTab(tab) {
      ['clients', 'grocery'].forEach(t => {
        document.getElementById('aview-' + t).classList.add('hidden');
        document.getElementById('atab-' + t).className = "px-3 py-2 rounded-xl bg-slate-100 text-slate-600 whitespace-nowrap";
      });
      document.getElementById('aview-' + tab).classList.remove('hidden');
      document.getElementById('atab-' + tab).className = "tab-active px-3 py-2 rounded-xl whitespace-nowrap";
    }

    function listenToClients() {
      db.collection('clients').orderBy('createdAt', 'desc').onSnapshot(snap => {
        liveClients = [];
        snap.forEach(d => liveClients.push({ id: d.id, ...d.data() }));
        renderClients();
      });
    }

    function renderClients() {
      const c = document.getElementById('admClientsList');
      c.innerHTML = '';
      if(liveClients.length === 0) { 
        c.innerHTML = '<div class="text-center py-6 text-slate-400">No clients yet.</div>'; 
        return; 
      }
      liveClients.forEach(cl => {
        const safeName = esc(cl.name);
        const safePhone = esc(cl.phone);
        const safeId = esc(cl.id);
        const safeGoal = esc(cl.goal || 'General Health');
        const weight = cl.weight ? `${cl.weight}kg` : '';
        const trialDays = Number(cl.trialDays) || 0;

        c.innerHTML += `
          <div class="card-clean p-3.5 rounded-2xl space-y-2 border">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs font-bold text-slate-800">${safeName} (${safePhone})</span>
                <div class="text-[10px] text-teal-700 font-bold mt-0.5">${safeGoal} ${weight ? '• ' + weight : ''}</div>
              </div>
              <span class="text-[10px] font-extrabold px-2 py-0.5 bg-teal-50 text-teal-800 rounded">
                ${trialDays >= 900 ? 'Lifetime VIP' : trialDays + ' Days'}
              </span>
            </div>
            <div class="flex items-center gap-1.5 pt-1">
              <button onclick="updateTrial('${safeId}', 30)" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-[10px] font-semibold rounded-lg transition">30 Days</button>
              <button onclick="updateTrial('${safeId}', 999)" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-white text-[10px] rounded-lg font-bold transition">Make VIP</button>
              <button onclick="deleteClient('${safeId}', '${safeName}')" class="text-rose-600 hover:text-rose-700 font-bold text-[10px] ml-auto px-2 py-1 bg-rose-50 rounded-lg transition">
                <i class="fa-solid fa-trash-can"></i> Delete
              </button>
            </div>
          </div>
        `;
      });
    }

    async function updateTrial(id, days) {
      try {
        await db.collection('clients').doc(id).update({ trialDays: days });
        alert('Updated access successfully!');
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    async function deleteClient(id, name) {
      if(!confirm(`Are you sure you want to delete ${name}? This cannot be undone.`)) return;
      try {
        await db.collection('clients').doc(id).delete();
      } catch (e) {
        alert('Error deleting: ' + e.message);
      }
    }

    function renderMasterGrocery() {
      const c = document.getElementById('groceryItemsList');
      c.innerHTML = '';
      for(let item in MASTER_GROCERY_DB) {
        const isHighGi = MASTER_GROCERY_DB[item].gi >= 70;
        const safeItem = esc(item);
        const data = MASTER_GROCERY_DB[item];
        c.innerHTML += `
          <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border text-xs">
            <span class="font-bold text-slate-800">${safeItem}</span>
            <div class="flex items-center gap-2">
              ${isHighGi ? '<span class="px-1.5 py-0.5 bg-rose-100 text-rose-800 text-[9px] font-black rounded">Red Zone</span>' : ''}
              <span class="text-teal-800 font-semibold">🔥 ${data.cal} kcal</span>
              <span class="text-emerald-800 font-semibold">💪 ${data.p}g Pro</span>
              <span class="text-sky-800 font-semibold">GI: ${data.gi}</span>
            </div>
          </div>`;
      }
    }

    function openModal() { document.getElementById('admModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('admModal').classList.add('hidden'); }

    async function addNewClientToCloud() {
      const n = document.getElementById('mName').value.trim();
      const p = document.getElementById('mPhone').value.trim().replace(/\D/g,'');
      const age = Number(document.getElementById('mAge').value) || 38;
      const height = Number(document.getElementById('mHeight').value) || 170;
      const weight = Number(document.getElementById('mWeight').value) || 75;
      const gender = document.getElementById('mGender').value;
      const activity = document.getElementById('mActivity').value;
      const goalKey = document.getElementById('mGoalKey').value;
      const d = document.getElementById('mDiet').value;
      const days = parseInt(document.getElementById('mDays').value) || 30;

      if(!n || p.length < 10) return alert('Enter valid name and 10-digit number');

      const goalsMap = {
        diabetes_reversal: "Type 2 Diabetes Remission",
        fat_loss: "Fat Loss & Deficit",
        muscle_gym: "Gym & Muscle Fitness",
        fatty_liver_bp: "Fatty Liver & BP Control"
      };

      try {
        const existing = await db.collection('clients').doc(p).get();
        if(existing.exists) {
          if(!confirm('A client with this phone number already exists. Overwrite?')) return;
        }

        await db.collection('clients').doc(p).set({
          name: n, phone: p, pin: p.slice(-4),
          age, height, weight, gender, activity, goalKey,
          goal: goalsMap[goalKey], diet: d, trialDays: days,
          joiningDate: new Date().toISOString().split('T')[0],
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          compliance: existing.exists && existing.data().compliance ? existing.data().compliance : {},
          weeklyPlan: existing.exists && existing.data().weeklyPlan ? existing.data().weeklyPlan : {}
        }, { merge: true });

        closeModal();
        alert('Client added to Cloud successfully with Protocol!');
      } catch (e) {
        alert('Error saving client: ' + e.message);
      }
    }
  </script>
</body>
</html>
