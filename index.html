<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metabolic Pro - Master Admin CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .card-clean { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); }
    .tab-active { background: #0f766e; color: #ffffff !important; font-weight: 700; }
  </style>
</head>
<body class="pb-24 antialiased">

  <!-- Admin Login View -->
  <div id="adminAuthView" class="min-h-screen flex flex-col justify-center p-4 max-w-sm mx-auto space-y-4">
    <div class="card-clean rounded-3xl p-6 shadow-xl border text-center space-y-4">
      <div class="w-14 h-14 rounded-2xl bg-slate-900 text-teal-400 flex items-center justify-center text-2xl font-black mx-auto">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <h2 class="text-xl font-black text-slate-900">Coach Master Admin</h2>
        <p class="text-xs text-slate-500 mt-0.5">Metabolic Pro Cloud CRM v4</p>
      </div>
      <div class="space-y-3 text-left">
        <input type="password" maxlength="8" id="inAdminPin" placeholder="Admin PIN દાખલ કરો" class="w-full p-3 bg-slate-50 border rounded-xl text-center text-xl font-black">
        <button onclick="verifyAdminPin()" class="w-full py-3.5 rounded-2xl bg-slate-900 text-white font-extrabold text-xs shadow">CRM એક્સેસ કરો 🔐</button>
      </div>
    </div>
  </div>

  <!-- Main Admin View -->
  <div id="adminMainView" class="hidden min-h-screen">
    <header class="p-3.5 bg-slate-900 text-white sticky top-0 z-40 flex justify-between items-center shadow-md">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-teal-500 text-slate-900 font-black flex items-center justify-center text-sm">MP</div>
        <div>
          <h1 class="font-extrabold text-white text-sm leading-tight">Admin CRM & Nudge Center</h1>
          <p class="text-[10px] text-teal-300" id="headerCoachDisplay">Coach: Loading...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openCoachSettingsModal()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-teal-300 rounded-lg text-xs font-bold border border-slate-700">⚙️ સેટિંગ્સ</button>
        <button onclick="logoutAdmin()" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg text-xs">Logout</button>
      </div>
    </header>

    <div class="flex p-2 gap-1.5 bg-white border-b text-xs overflow-x-auto">
      <button onclick="setAdminTab('nudge')" id="atab-nudge" class="tab-active px-3 py-2 rounded-xl whitespace-nowrap"><i class="fa-brands fa-whatsapp text-emerald-400"></i> WhatsApp નજ ક્યૂ (Queue)</button>
      <button onclick="setAdminTab('clients')" id="atab-clients" class="px-3 py-2 rounded-xl bg-slate-100 text-slate-600 whitespace-nowrap"><i class="fa-solid fa-users"></i> તમામ ક્લાયન્ટ્સ</button>
    </div>

    <main class="p-3.5 max-w-xl mx-auto space-y-3.5">
      
      <!-- TAB 1: WHATSAPP NUDGE QUEUE RUNNER -->
      <section id="aview-nudge" class="space-y-3">
        <div class="card-clean p-4 rounded-2xl space-y-3">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b pb-2.5">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="font-bold text-slate-900 text-sm">સ્માર્ટ વોટ્સએપ નજ ક્યૂ રનર</h2>
                <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[9px] font-black" id="activeTimeSlotBadge">🕒 Auto-Detecting...</span>
              </div>
              <p class="text-[11px] text-slate-500 mt-0.5">ઘડિયાળના સમય મુજબ ભોજનનો રિમાઇન્ડર આપોઆપ પસંદ થશે.</p>
            </div>
            
            <select id="selNudgeMealType" onchange="handleManualSlotChange()" class="p-2 bg-slate-100 border border-slate-300 rounded-xl text-xs font-bold text-teal-900">
              <option value="breakfast">🥗 સવારનો નાસ્તો (Breakfast)</option>
              <option value="lunch">🍲 બપોરનું ભોજન (Lunch)</option>
              <option value="walk">🚶‍♂️ પોસ્ટ-મીલ વોક (Post-Meal Walk)</option>
              <option value="snack">🥜 સાંજનો નાસ્તો (Snack / Water)</option>
              <option value="dinner">🥣 રાત્રિ ભોજન (Dinner)</option>
            </select>
          </div>

          <!-- Pool Filter Chips -->
          <div class="flex gap-1.5 text-[11px] overflow-x-auto pb-1">
            <button onclick="setPoolFilter('trial')" id="pfilter-trial" class="px-3 py-1.5 rounded-xl bg-teal-600 text-white font-bold whitespace-nowrap">⏳ 30-Day Trial (<span id="cntTrial">0</span>)</button>
            <button onclick="setPoolFilter('vip')" id="pfilter-vip" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600 font-bold whitespace-nowrap">👑 VIP Paid (<span id="cntVip">0</span>)</button>
            <button onclick="setPoolFilter('pending')" id="pfilter-pending" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600 font-bold whitespace-nowrap">⚠️ Pending WA (<span id="cntPending">0</span>)</button>
            <button onclick="setPoolFilter('expired')" id="pfilter-expired" class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600 font-bold whitespace-nowrap">🔒 Expired (<span id="cntExpired">0</span>)</button>
          </div>
        </div>

        <div id="queueClientsContainer" class="space-y-2"></div>
      </section>

      <!-- TAB 2: ALL CLIENTS & ACCESS -->
      <section id="aview-clients" class="hidden space-y-3">
        <div id="admClientsList" class="space-y-3"></div>
      </section>
    </main>
  </div>

  <!-- COACH SETTINGS MODAL -->
  <div id="modalCoachSettings" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm p-5 rounded-3xl space-y-3.5 text-xs shadow-2xl border">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-extrabold text-slate-900 text-sm">કોચ પ્રોફાઇલ & WhatsApp નંબર</h3>
        <button onclick="closeCoachSettingsModal()"><i class="fa-solid fa-xmark text-slate-400 text-base"></i></button>
      </div>

      <div class="space-y-2.5">
        <div>
          <label class="font-bold text-slate-700 block mb-1">કોચનું પૂરું નામ</label>
          <input type="text" id="setCoachName" placeholder="દા.ત. Piyush Nathavani" class="w-full p-2.5 bg-slate-50 border rounded-xl font-bold">
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">કોચનો WhatsApp નંબર (૧૦ અંક)</label>
          <input type="tel" id="setCoachPhone" placeholder="દા.ત. 9925879138" class="w-full p-2.5 bg-slate-50 border rounded-xl font-bold">
          <p class="text-[10px] text-teal-700 mt-1">બધા ક્લાયન્ટ્સના મેસેજ અને 'Hi' આ નંબર પર આપમેળે જશે.</p>
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="closeCoachSettingsModal()" class="flex-1 bg-slate-100 py-2.5 rounded-xl font-bold">રદ કરો</button>
        <button onclick="saveCoachSettingsToCloud()" class="flex-1 bg-teal-600 text-white font-extrabold py-2.5 rounded-xl shadow">નંબર અપડેટ કરો 💾</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC7HLpZIEayOfmUuHVK_8Fm34Un73i33KE",
      authDomain: "metabolic-pro-bd3a2.firebaseapp.com",
      projectId: "metabolic-pro-bd3a2",
      storageBucket: "metabolic-pro-bd3a2.firebasestorage.app",
      messagingSenderId: "462945165017",
      appId: "1:462945165017:web:4e4727c725eb643a29a8c8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    let liveClients = [];
    let currentPool = 'trial';
    let sentTracker = {};
    let isManualOverride = false;
    let activeCoachPhone = "919081421028";
    let activeCoachName = "Metabolic Pro Coach";

    // Format phone to guarantee pure digits with 91 country code
    function formatWaPhone(phone) {
      let clean = String(phone || '').replace(/\D/g, '');
      if (clean.length === 10) clean = '91' + clean;
      if (clean.startsWith('0') && clean.length === 11) clean = '91' + clean.substring(1);
      return clean;
    }

    // Load Coach Info from Firestore Cloud Settings
    async function loadCoachSettings() {
      try {
        const doc = await db.collection('settings').doc('coach').get();
        if (doc.exists) {
          const d = doc.data();
          activeCoachPhone = formatWaPhone(d.phone || "9081421028");
          activeCoachName = d.name || "Metabolic Pro Coach";
        }
        document.getElementById('headerCoachDisplay').innerText = `Coach: ${activeCoachName} (${activeCoachPhone})`;
      } catch(e) { console.error("Error loading coach:", e); }
    }

    function openCoachSettingsModal() {
      document.getElementById('setCoachName').value = activeCoachName;
      document.getElementById('setCoachPhone').value = activeCoachPhone.replace(/^91/, '');
      document.getElementById('modalCoachSettings').classList.remove('hidden');
    }

    function closeCoachSettingsModal() {
      document.getElementById('modalCoachSettings').classList.add('hidden');
    }

    async function saveCoachSettingsToCloud() {
      const name = document.getElementById('setCoachName').value.trim();
      const phoneRaw = document.getElementById('setCoachPhone').value.trim();
      const cleanPhone = formatWaPhone(phoneRaw);

      if(!name || cleanPhone.length < 12) return alert('સાચું નામ અને ૧૦-અંકનો મોબાઈલ નંબર દાખલ કરો.');

      await db.collection('settings').doc('coach').set({
        name: name,
        phone: cleanPhone,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });

      activeCoachName = name;
      activeCoachPhone = cleanPhone;
      document.getElementById('headerCoachDisplay').innerText = `Coach: ${activeCoachName} (${activeCoachPhone})`;
      closeCoachSettingsModal();
      alert(`✅ કોચ નંબર સફળતાપૂર્વક અપડેટ થયો: ${activeCoachPhone}`);
    }

    function resolveCurrentTimeSlot() {
      const now = new Date();
      const totalMinutes = (now.getHours() * 60) + now.getMinutes();

      if (totalMinutes >= 360 && totalMinutes < 660) return { slot: 'breakfast', label: '🌅 નાસ્તો સ્લોટ' };
      else if (totalMinutes >= 660 && totalMinutes < 840) return { slot: 'lunch', label: '🍲 લંચ સ્લોટ' };
      else if (totalMinutes >= 840 && totalMinutes < 1020) return { slot: 'walk', label: '🚶‍♂️ વોક સ્લોટ' };
      else if (totalMinutes >= 1020 && totalMinutes < 1170) return { slot: 'snack', label: '🥜 સ્નેક સ્લોટ' };
      else return { slot: 'dinner', label: '🥣 ડિનર સ્લોટ' };
    }

    function autoApplyTimeSlot() {
      if (isManualOverride) return;
      const detected = resolveCurrentTimeSlot();
      const sel = document.getElementById('selNudgeMealType');
      if (sel) sel.value = detected.slot;
      const badge = document.getElementById('activeTimeSlotBadge');
      if (badge) badge.innerText = `🕒 ${detected.label} (ઓટો-સેટ)`;
    }

    function handleManualSlotChange() {
      isManualOverride = true;
      const badge = document.getElementById('activeTimeSlotBadge');
      if (badge) {
        badge.innerText = `⚙️ મેન્યુઅલ સિલેક્શન`;
        badge.className = "px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 text-[9px] font-black";
      }
      renderQueue();
    }

    function verifyAdminPin() {
      const pin = document.getElementById('inAdminPin').value.trim();
      if(pin === '1234') {
        document.getElementById('adminAuthView').classList.add('hidden');
        document.getElementById('adminMainView').classList.remove('hidden');
        loadCoachSettings();
        autoApplyTimeSlot();
        listenToClients();
      } else {
        alert('ખોટો PIN છે.');
      }
    }

    function logoutAdmin() { location.reload(); }

    function setAdminTab(tab) {
      ['nudge', 'clients'].forEach(t => {
        document.getElementById('aview-' + t).classList.add('hidden');
        document.getElementById('atab-' + t).className = "px-3 py-2 rounded-xl bg-slate-100 text-slate-600 whitespace-nowrap";
      });
      document.getElementById('aview-' + tab).classList.remove('hidden');
      document.getElementById('atab-' + tab).className = "tab-active px-3 py-2 rounded-xl whitespace-nowrap";
    }

    function listenToClients() {
      db.collection('clients').orderBy('createdAt', 'desc').onSnapshot(snap => {
        liveClients = [];
        snap.forEach(d => liveClients.push({ id: d.id, ...d.data() }));
        updatePoolCounters();
        renderQueue();
        renderClientsList();
      });
    }

    function getDaysActive(joiningDateStr) {
      if(!joiningDateStr) return 0;
      const jDate = new Date(joiningDateStr);
      const now = new Date();
      return Math.ceil(Math.abs(now - jDate) / (1000 * 60 * 60 * 24));
    }

    function updatePoolCounters() {
      let cTrial = 0, cVip = 0, cPending = 0, cExpired = 0;
      liveClients.forEach(c => {
        const isVIP = (Number(c.trialDays) >= 900);
        const days = getDaysActive(c.joiningDate);
        const isExpired = !isVIP && (days > (Number(c.trialDays) || 30));

        if (!c.whatsappVerified) cPending++;
        else if (isVIP) cVip++;
        else if (isExpired) cExpired++;
        else cTrial++;
      });

      document.getElementById('cntTrial').innerText = cTrial;
      document.getElementById('cntVip').innerText = cVip;
      document.getElementById('cntPending').innerText = cPending;
      document.getElementById('cntExpired').innerText = cExpired;
    }

    function setPoolFilter(pool) {
      currentPool = pool;
      ['trial', 'vip', 'pending', 'expired'].forEach(p => {
        document.getElementById('pfilter-' + p).className = "px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600 font-bold whitespace-nowrap";
      });
      document.getElementById('pfilter-' + pool).className = "px-3 py-1.5 rounded-xl bg-teal-600 text-white font-bold whitespace-nowrap";
      renderQueue();
    }

    function renderQueue() {
      const container = document.getElementById('queueClientsContainer');
      container.innerHTML = '';
      const mealType = document.getElementById('selNudgeMealType').value;

      const filtered = liveClients.filter(c => {
        const isVIP = (Number(c.trialDays) >= 900);
        const days = getDaysActive(c.joiningDate);
        const isExpired = !isVIP && (days > (Number(c.trialDays) || 30));

        if (currentPool === 'pending') return !c.whatsappVerified;
        if (currentPool === 'vip') return isVIP && c.whatsappVerified;
        if (currentPool === 'expired') return isExpired && c.whatsappVerified;
        return !isVIP && !isExpired && c.whatsappVerified;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">આ પૂલમાં કોઈ ક્લાયન્ટ નથી.</div>`;
        return;
      }

      filtered.forEach(cl => {
        const isSent = sentTracker[`${cl.id}_${mealType}`];
        const conditions = (cl.conditions || []).join(' • ');

        container.innerHTML += `
          <div class="card-clean p-3 rounded-2xl flex items-center justify-between border">
            <div>
              <div class="font-extrabold text-slate-900 text-xs">${esc(cl.name)} (${esc(cl.phone)})</div>
              <div class="text-[10px] text-teal-700 font-bold mt-0.5">${esc(conditions)}</div>
            </div>

            <div class="flex items-center gap-1.5">
              ${isSent ? `
                <span class="px-2 py-1 bg-emerald-100 text-emerald-900 font-extrabold text-[10px] rounded-lg">
                  <i class="fa-solid fa-check-double"></i> Sent
                </span>
              ` : `
                <button onclick="sendNudgeWhatsApp('${cl.id}', '${mealType}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl flex items-center gap-1 shadow-xs transition">
                  <i class="fa-brands fa-whatsapp text-sm"></i> Send
                </button>
              `}
            </div>
          </div>
        `;
      });
    }

    function sendNudgeWhatsApp(clientId, mealType) {
      const cl = liveClients.find(c => c.id === clientId);
      if(!cl) return;

      const validPhone = formatWaPhone(cl.phone);

      let msg = "";
      if (mealType === 'breakfast') {
        msg = `નમસ્તે ${cl.name}! 🌅 સવારના નાસ્તાનો સમય થયો છે.\nપ્રોટીન અને ફાઈબરથી ભરપૂર નાસ્તો લઈ લેજો. જમ્યા પછી પોર્ટલમાં 'લીધું' ટીક કરી લેજો 📲`;
      } else if (mealType === 'lunch') {
        msg = `નમસ્તે ${cl.name}! 🍲 બપોરના ભોજનનો સમય થયો છે.\nયાદ રાખજો: પહેલાં સલાડ પૂરું કરવાનું છે, પછી જ રોટલો અને શાક લેવું જેથી બ્લડ શુગર સ્થિર રહે.\nજમ્યા પછી પોર્ટલમાં 'લીધું' ટીક કરી લેજો 📲`;
      } else if (mealType === 'walk') {
        msg = `નમસ્તે ${cl.name}! 🚶‍♂️ પોસ્ટ-મીલ ૧૫ મિનિટ વૉકનો સમય!\nજમ્યા પછી તરત હળવું ચાલવાથી શુગર સ્પાઇક અટકે છે અને પાચન ઝડપી બને છે.`;
      } else if (mealType === 'snack') {
        msg = `નમસ્તે ${cl.name}! 🥜 સાંજનો નાસ્તો & વોટર ચેક!\n૧ ગ્લાસ જીરા છાશ અથવા શેકેલા મખાના લઈ લેજો અને દિવસનું પાણીનું લક્ષ્ય પૂરું કરજો.`;
      } else {
        msg = `નમસ્તે ${cl.name}! 🥣 રાત્રિ ભોજન (Light Dinner) નો સમય થયો છે.\n૮:૩૦ પહેલાં હળવો સૂપ કે બાફેલા કઠોળ લઈ લેજો જેથી લિવર ડિટોક્સ રાત્રે વ્યવસ્થિત થાય.`;
      }

      sentTracker[`${cl.id}_${mealType}`] = true;
      renderQueue();

      window.open(`https://api.whatsapp.com/send?phone=${validPhone}&text=${encodeURIComponent(msg)}`, '_blank');
    }

    function renderClientsList() {
      const c = document.getElementById('admClientsList');
      c.innerHTML = '';
      liveClients.forEach(cl => {
        const safeId = esc(cl.id);
        const safeName = esc(cl.name);
        const trialDays = Number(cl.trialDays) || 0;
        const isVIP = trialDays >= 900;

        c.innerHTML += `
          <div class="card-clean p-3 rounded-2xl border flex justify-between items-center text-xs">
            <div>
              <div class="font-bold text-slate-800">${safeName} (${cl.phone})</div>
              <div class="text-[10px] text-teal-700 font-semibold">${(cl.conditions||[]).join(', ')} • PIN: ${cl.pin}</div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="updateTrial('${safeId}', ${isVIP ? 30 : 999})" class="px-2.5 py-1 ${isVIP ? 'bg-amber-100 text-amber-900' : 'bg-slate-900 text-white'} text-[10px] font-bold rounded-lg">
                ${isVIP ? 'Revoke VIP' : 'Make VIP 👑'}
              </button>
            </div>
          </div>
        `;
      });
    }

    async function updateTrial(id, days) {
      await db.collection('clients').doc(id).update({ trialDays: days });
    }

    setInterval(autoApplyTimeSlot, 120000);
  </script>
